<!doctype html>
<html data-theme="swamp-dark">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/global.css">
  <link rel="stylesheet" href="/src/styles/icons.css">
  <link rel="stylesheet" href="/src/styles/issues.css">
  <style>
    #mainColumn, #chatArea { height: 100vh; }
  </style>
</head>
<body>
  <div id="osAppsLayer"><main id="issuesView" class="issues-page"></main></div>
  <div id="mainColumn"><div id="chatArea" class="chat-area"></div></div>
  <script type="module">
    import { setIssuesStateForTests } from '/src/state/issues-store.ts';
    import { createEmptyChatObject, setSessionStateForTests } from '/src/state/sessions.ts';
    import { openIssuesEmbeddedInCode } from '/src/ui/issues-page.ts';
    const chat = createEmptyChatObject('test-model');
    setSessionStateForTests({ version: 3, activeId: chat.id, chats: [chat], sidebarCollapsed: false });
    const specs = [
      ['MIN-1', 'Make issue relationships easier to scan'],
      ['MIN-2', 'Draw a connecting rail', 'MIN-1'],
      ['MIN-3', 'Check light and dark themes', 'MIN-1'],
      ['MIN-4', 'Verify compact layout', 'MIN-1'],
      ['MIN-5', 'Improve workspace startup'],
      ['MIN-6', 'Measure loading time', 'MIN-5'],
      ['MIN-7', 'Update the user manual'],
      ['MIN-8', 'Child with a hidden parent', 'MIN-9'],
      ['MIN-9', 'Hidden completed parent', undefined, 'done'],
    ];
    window.qaIssues = specs.map(([id, title, parentId, status], index) => ({
      id, title, parentId, status: status ?? 'todo', type: 'task', priority: 'medium',
      description: '', labels: [], workspacePath: '', source: 'user',
      createdAt: 100 - index, updatedAt: 100 - index,
    }));
    setIssuesStateForTests({ version: 2, nextId: 10, issues: window.qaIssues, workspaces: {} });
    await openIssuesEmbeddedInCode();
    window.qaReady = true;
  </script>
</body>
</html>
