# Required CI gate for pull requests and main (MIN-383).
# Enable branch protection: Settings → Branches → main → require status check "ci".
name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-app-server:
    name: Codex app-server protocol
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex@0.153.4
      - name: Installed CLI with local fake inference
        run: node --test test/generations/agent-cli-codex-app-server-smoke.test.mjs test/generations/agent-cli-codex-app-server-live.test.mjs
        env:
          MINNOW_CODEX_APP_SERVER_SMOKE: '1'

  product-wiki:
    name: product wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Product wiki catalog and manual copy gates
        run: npm run test:product-wiki

  board-scenario-contract:
    name: board scenario contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deterministic board scenario contracts
        run: npm run board:scenario-contract

  performance-budgets:
    name: performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Bundle size budgets
        run: npm run check:performance-budgets

  gate:
    name: typecheck + tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # windows-latest often spends ~17 min in npm test; 20 left no headroom after setup.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build minnow-sandbox helper (Linux Landlock)
        if: matrix.os == 'ubuntu-latest'
        run: npm run sandbox:ensure-helper

      - name: Upload minnow-sandbox ELF (Windows packaging / WSL)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: minnow-sandbox-linux-elf
          path: native/minnow-sandbox/minnow-sandbox
          if-no-files-found: error

      - name: Verify test discovery coverage
        run: npm run test:check-coverage

      - name: Verify Uicons registry
        run: npm run check:icons

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test suite
        run: npm test
