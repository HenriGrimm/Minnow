# Board nightly — V2 journal suite (MIN-716)

# V1 persisted / restart / soak / gate-metrics scripts were retired with
# `test/orchestrate/`. Crash recovery and scheduler conformance live in
# `test/orchestrator/` (P1-F / P1-G) and already run on every PR via `npm test`.
# This workflow re-runs that suite on a schedule so a flake that slipped the
# PR window still shows up overnight.

name: board nightly reliability

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: board-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrator-suite:
    name: orchestrator suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Orchestrator V2 suite (P1-F / P1-G + keepers)
        run: node test/run-all.mjs --suite orchestrator
        # `runner` is not available in job-level `env`, so MINNOW_HOME is set on the step.
        env:
          MINNOW_HOME: ${{ runner.temp }}/minnow-board-gates
