name: Reef acceptance fixtures
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/reef/**'
      - 'src/reef/**'
      - 'src/ui/reef*'
      - 'src/headless/**'
      - 'test/reef/**'
      - '.github/workflows/reef.yml'
permissions:
  contents: read
concurrency:
  group: reef-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MINNOW_REEF_E2E: '1'
      MINNOW_REEF_EXPORT_E2E: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx --yes playwright@1.64.0 install-deps chromium
      - if: runner.os == 'Linux'
        run: xvfb-run -a node --test test/reef/pipeline.test.mjs
      - if: runner.os != 'Linux'
        run: node --test test/reef/pipeline.test.mjs
